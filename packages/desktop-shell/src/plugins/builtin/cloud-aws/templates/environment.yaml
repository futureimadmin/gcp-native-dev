AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Nativity Studio environment. One CloudFormation stack per environment: a container registry, an encrypted private data bucket,
  a log group, a runtime role for the running application and a deployer role that developers assume (no long-lived keys).

Parameters:
  AppName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,19}[a-z0-9]$'
  EnvName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9]{0,11}$'
  TrustedPrincipalArn:
    Type: String
    Description: 'Who may assume the deployer role: any principal of this account that is allowed to call sts:AssumeRole.'
  Protected:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: A protected (production-like) environment gets immutable image tags, bucket versioning and longer log retention.

  GitHubRepo:
    Type: String
    Default: ''
    Description: Optional owner/name of a GitHub repository whose pipeline may assume the deployer role (OpenID Connect, no stored keys), for this environment only.
  CreateGitHubOidcProvider:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Create the GitHub OIDC provider in this account. An account can have only one, so say true once per account.

Conditions:
  IsProtected: !Equals [!Ref Protected, 'true']
  HasGitHubRepo: !Not [!Equals [!Ref GitHubRepo, '']]
  MakeOidcProvider: !And [!Condition HasGitHubRepo, !Equals [!Ref CreateGitHubOidcProvider, 'true']]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${AppName}-${EnvName}'
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: !If [IsProtected, IMMUTABLE, MUTABLE]
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}'

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: !If
        - IsProtected
        - Status: Enabled
        - !Ref AWS::NoValue

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${AppName}/${EnvName}'
      RetentionInDays: !If [IsProtected, 365, 30]

  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${EnvName}-runtime'
      Description: Identity of the running application in this environment
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com, ecs-tasks.amazonaws.com, tasks.apprunner.amazonaws.com]
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${LogGroup.Arn}:*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${DataBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn

  DeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${EnvName}-deployer'
      Description: Assumed by developers and pipelines to change this environment (short-lived credentials)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
          - !If
            - HasGitHubRepo
            - Effect: Allow
              Principal:
                Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
              Action: sts:AssumeRoleWithWebIdentity
              Condition:
                StringEquals:
                  'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                  'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepo}:environment:${EnvName}'
            - !Ref AWS::NoValue
      Policies:
        - PolicyName: deploy-this-environment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:CompleteLayerUpload, ecr:GetDownloadUrlForLayer, ecr:InitiateLayerUpload, ecr:PutImage, ecr:UploadLayerPart, ecr:DescribeImages]
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource: [!GetAtt DataBucket.Arn, !Sub '${DataBucket.Arn}/*']
              - Effect: Allow
                Action: [logs:DescribeLogStreams, logs:GetLogEvents, logs:FilterLogEvents]
                Resource: !Sub '${LogGroup.Arn}:*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RuntimeRole.Arn
              - Effect: Allow
                Action: [cloudformation:*]
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-${EnvName}/*'

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  DataBucketName:
    Value: !Ref DataBucket
  LogGroupName:
    Value: !Ref LogGroup
  RuntimeRoleArn:
    Value: !GetAtt RuntimeRole.Arn
  DeployerRoleArn:
    Value: !GetAtt DeployerRole.Arn
