<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Nativity Studio</title>
<style>
  :root { --ink: #2a1800; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; align-items: center; justify-content: center; opacity: 0; animation: appear .5s ease-out forwards; }
  body.bye { animation: bye .45s ease-in forwards; }
  @keyframes appear { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes bye { to { opacity: 0; transform: scale(1.03); } }

  .card { position: relative; width: 520px; height: 320px; border-radius: 24px; overflow: hidden; color: var(--ink); text-align: center;
    background: radial-gradient(circle at 50% 34%, #fff6bd 0%, #ffd84a 26%, #fbb013 58%, #d98300 86%, #b86500 100%);
    box-shadow: 0 0 0 1px rgba(255, 244, 190, .75) inset, 0 0 50px 4px rgba(255, 190, 40, .55), 0 14px 36px rgba(120, 60, 0, .45); }

  /* the sunburst: rays that turn slowly behind everything */
  .rays { position: absolute; left: 50%; top: 34%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .42) 0deg 5deg, rgba(255, 255, 255, 0) 5deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, .6) 30%, transparent 62%); mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, .6) 30%, transparent 62%);
    animation: spin 40s linear infinite; }
  .rays.slow { animation-duration: 70s; animation-direction: reverse; opacity: .55; transform: scale(.8); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .glow { position: absolute; left: 50%; top: 34%; width: 340px; height: 340px; margin: -170px 0 0 -170px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, .95) 0%, rgba(255, 244, 170, .6) 32%, rgba(255, 220, 90, 0) 70%); animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(.92); opacity: .8; } 50% { transform: scale(1.08); opacity: 1; } }

  .spark { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fffbe0; box-shadow: 0 0 9px 3px rgba(255, 255, 255, .9); opacity: 0; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1.2); } }

  /* the two marks: FutureIM and Nativity (the cloud) */
  .logos { position: absolute; left: 0; right: 0; top: 34px; display: flex; align-items: center; justify-content: center; gap: 22px; }
  .logos img { width: 104px; height: 104px; border-radius: 22px; object-fit: cover; border: 3px solid rgba(255, 252, 225, .95); animation: float 4.2s ease-in-out infinite;
    box-shadow: 0 0 30px 6px rgba(255, 236, 140, .9), 0 8px 20px rgba(110, 55, 0, .5); }
  .logos img.nat { animation-delay: -2.1s; border-color: rgba(255, 252, 225, .85); }
  .logos .div { width: 2px; height: 70px; border-radius: 2px; background: linear-gradient(180deg, rgba(90, 50, 0, 0), rgba(90, 50, 0, .45), rgba(90, 50, 0, 0)); }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  .text { position: absolute; left: 0; right: 0; top: 160px; }
  h1 { margin: 0; font-size: 29px; font-weight: 800; letter-spacing: .04em; color: var(--ink); text-shadow: 0 1px 0 rgba(255, 245, 190, .85), 0 0 18px rgba(255, 245, 190, .85); }
  .edition { height: 18px; margin-top: 3px; font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: rgba(60, 32, 0, .82); opacity: 0; transition: opacity .6s ease; }
  .edition.on { opacity: 1; }

  .bar { position: absolute; left: 50%; top: 238px; width: 200px; height: 3px; margin-left: -100px; border-radius: 3px; background: rgba(90, 50, 0, .22); overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; width: 38%; border-radius: 3px; background: linear-gradient(90deg, rgba(255, 255, 255, 0), #fff 50%, rgba(255, 255, 255, 0)); animation: slide 1.5s ease-in-out infinite; }
  @keyframes slide { from { left: -40%; } to { left: 102%; } }

  .powered { position: absolute; left: 0; right: 0; bottom: 20px; font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: rgba(55, 30, 0, .85); text-shadow: 0 0 10px rgba(255, 240, 170, .9); }
</style>
</head>
<body>
  <div class="card">
    <div class="rays"></div><div class="rays slow"></div><div class="glow"></div>
    <i class="spark" style="left: 10%; top: 16%; animation-delay: .2s"></i><i class="spark" style="left: 88%; top: 22%; animation-delay: 1.1s"></i>
    <i class="spark" style="left: 20%; top: 66%; animation-delay: 2s"></i><i class="spark" style="left: 80%; top: 70%; animation-delay: .7s"></i>
    <i class="spark" style="left: 50%; top: 6%; animation-delay: 1.6s"></i>
    <div class="logos">
      <img src="assets/futureim-logo.jpg" alt="FutureIM" />
      <span class="div"></span>
      <img class="nat" src="assets/logo.svg" alt="Nativity Studio" />
    </div>
    <div class="text"><h1>Nativity Studio</h1><div class="edition" id="ed"></div></div>
    <div class="bar"><i></i></div>
    <div class="powered">Powered by Future Intelligent Machines</div>
  </div>
<script>
  // only the edition is ever shown here: no loading details
  function setEdition(t) { const e = document.getElementById('ed'); e.textContent = t; e.classList.add('on'); }
</script>
</body>
</html>
